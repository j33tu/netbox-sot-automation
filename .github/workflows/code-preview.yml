name: Code Branch Preview (No Deploy)

on:
  push:
    branches: [ code-dev, code-main ]
  pull_request:
    branches: [ code-dev, code-main ]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Target Environment Secrets
        id: target
        run: |
          if [ "${{ github.ref }}" == "refs/heads/code-main" ] || [ "${{ github.base_ref }}" == "code-main" ]; then
            echo "URL=${{ secrets.NETBOX_PROD_URL }}" >> $GITHUB_OUTPUT
            echo "TOKEN=${{ secrets.NETBOX_PROD_TOKEN }}" >> $GITHUB_OUTPUT
            echo "STACK=prod" >> $GITHUB_OUTPUT
          else
            echo "URL=${{ secrets.NETBOX_DEV_URL }}" >> $GITHUB_OUTPUT
            echo "TOKEN=${{ secrets.NETBOX_DEV_TOKEN }}" >> $GITHUB_OUTPUT
            echo "STACK=dev" >> $GITHUB_OUTPUT
          fi

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5

      - name: Pulumi Preview
        run: |
          pulumi login --local
          pulumi stack select ${{ steps.target.outputs.STACK }} || pulumi stack init ${{ steps.target.outputs.STACK }}
          pulumi preview
        env:
          PULUMI_CONFIG_PASSPHRASE: ""
          NETBOX_URL: ${{ steps.target.outputs.URL }}
          NETBOX_TOKEN: ${{ steps.target.outputs.TOKEN }}
