name: Stack Branch Deployment

on:
  push:
    branches: [ stack-dev, stack-prod ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Target Environment Secrets
        id: env_config
        run: |
          if [ "${{ github.ref }}" == "refs/heads/stack-prod" ]; then
            echo "ENV_NAME=Production" >> $GITHUB_OUTPUT
            echo "URL=${{ secrets.NETBOX_PROD_URL }}" >> $GITHUB_OUTPUT
            echo "TOKEN=${{ secrets.NETBOX_PROD_TOKEN }}" >> $GITHUB_OUTPUT
            echo "STACK=prod" >> $GITHUB_OUTPUT
          else
            echo "ENV_NAME=Development" >> $GITHUB_OUTPUT
            echo "URL=${{ secrets.NETBOX_DEV_URL }}" >> $GITHUB_OUTPUT
            echo "TOKEN=${{ secrets.NETBOX_DEV_TOKEN }}" >> $GITHUB_OUTPUT
            echo "STACK=dev" >> $GITHUB_OUTPUT
          fi

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5

      - name: Run Pulumi Deployment
        run: |
          pulumi login --local
          pulumi stack select ${{ steps.env_config.outputs.STACK }} || pulumi stack init ${{ steps.env_config.outputs.STACK }}
          pulumi up --yes
        env:
          PULUMI_CONFIG_PASSPHRASE: ""
          NETBOX_URL: ${{ steps.env_config.outputs.URL }}
          NETBOX_TOKEN: ${{ steps.env_config.outputs.TOKEN }}

      - name: Output Environment Deployment Info
        run: |
          echo "================================================="
          echo " Successfully deployed to ${{ steps.env_config.outputs.ENV_NAME }}!"
          echo " NetBox Instance URL: ${{ steps.env_config.outputs.URL }}"
          echo " Stack Name: ${{ steps.env_config.outputs.STACK }}"
          echo "================================================="
